<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lass Commentary - OBS Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive;
            overflow: hidden;
        }

        .widget-container {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 20px;
            max-width: 600px;
        }

        .character {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .speech-bubble {
            position: relative;
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 450px;
            min-height: 60px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            bottom: 20px;
            border-width: 10px;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            filter: drop-shadow(-3px 2px 3px rgba(0,0,0,0.1));
        }

        .commentary-text {
            color: #2d3436;
            font-size: 18px;
            line-height: 1.5;
            font-weight: 500;
        }

        .commentary-text.empty {
            color: #b2bec3;
            font-style: italic;
        }

        .typing-indicator {
            display: none;
        }

        .typing-indicator.active {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #636e72;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Connection status */
        .status-dot {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="status-dot" id="statusDot"></div>
    
    <div class="widget-container">
        <div class="character">👧</div>
        <div class="speech-bubble">
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
            <p class="commentary-text" id="commentaryText">Waiting for Lass...</p>
        </div>
    </div>

    <script>
        const WS_URL = 'ws://localhost:8765';
        const commentaryText = document.getElementById('commentaryText');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusDot = document.getElementById('statusDot');

        let ws = null;
        let reconnectTimeout = null;
        let lastCommentary = '';

        function extractCommentary(text) {
            if (!text) return null;
            
            // Look for COMMENTARY section (section 9 in the analysis)
            // Pattern: "9. COMMENTARY" or "COMMENTARY" followed by content
            const patterns = [
                /(?:9\.|8\.)\s*COMMENTARY[:\s]*[-–]\s*(.+?)(?=\n\d+\.|$)/is,
                /COMMENTARY[:\s]*[-–]\s*(.+?)(?=\n\d+\.|$|\n\n)/is,
                /Lass persona[:\s]*(.+?)(?=\n\d+\.|$|\n\n)/is,
            ];

            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    let commentary = match[1].trim();
                    // Clean up any leading dashes or bullets
                    commentary = commentary.replace(/^[-–•]\s*/, '');
                    // Remove any trailing section markers
                    commentary = commentary.replace(/\n.*$/, '');
                    if (commentary.length > 5) {
                        return commentary;
                    }
                }
            }
            return null;
        }

        function updateCommentary(text) {
            if (text && text !== lastCommentary) {
                lastCommentary = text;
                commentaryText.classList.remove('empty');
                commentaryText.textContent = text;
                typingIndicator.classList.remove('active');
                
                // Re-trigger animation
                const bubble = document.querySelector('.speech-bubble');
                bubble.style.animation = 'none';
                bubble.offsetHeight; // Trigger reflow
                bubble.style.animation = 'fadeIn 0.3s ease-out';
            }
        }

        function showTyping() {
            typingIndicator.classList.add('active');
            commentaryText.textContent = '';
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('Connected to Pokemon LLM WebSocket');
                statusDot.classList.add('connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Check for processingStatus (typing indicator)
                    if (data.processingStatus) {
                        showTyping();
                    }
                    
                    // Check for response_log (contains analysis with commentary)
                    if (data.response_log && data.response_log.text) {
                        const commentary = extractCommentary(data.response_log.text);
                        if (commentary) {
                            updateCommentary(commentary);
                        }
                    }
                    
                    // Also check log_history for initial state
                    if (data.log_history && Array.isArray(data.log_history)) {
                        for (const entry of data.log_history) {
                            if (entry.is_response && entry.text) {
                                const commentary = extractCommentary(entry.text);
                                if (commentary) {
                                    updateCommentary(commentary);
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket message:', e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                statusDot.classList.remove('connected');
                reconnectTimeout = setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                ws.close();
            };
        }

        // Start connection
        connect();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            if (ws) ws.close();
        });
    </script>
</body>
</html>
