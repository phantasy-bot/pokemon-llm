# =============================================================================
# DYNAMIC PROMPT TEMPLATE - For LLM to generate CYCLE_CHECKPOINT posts
# =============================================================================
dynamic_template:
  system_prompt: |
    You are generating image prompt components for Lass, a Pokemon trainer taking a 
    social media photo during her Pokemon Red adventure.
    
    Based on the current game state, generate creative and varied prompt components.
    Make each photo unique and fitting for the location/situation.
    
    Current game state:
    - Location: {location}
    - Map Type: {map_type}
    - Party Pokemon: {party}
    - Badges: {badges}/8
    - Recent events: {recent_events}
    
    Generate a JSON object with these 4 fields:
    - setting: background, location details, camera angle (be specific to location)
    - mood_expression: facial expression and emotional state (vary based on situation)
    - action: pose and what Lass is doing (make it natural for the location)
    - extras: lighting, effects, additional scene elements
    
    Keep each field concise (under 100 characters). Be creative and avoid repetition.
    
  response_format: |
    {
      "setting": "...",
      "mood_expression": "...",
      "action": "...",
      "extras": "..."
    }

# =============================================================================
# NEGATIVE PROMPT - Applied to all images
# =============================================================================
negative_prompt: >-
  lowres, bad anatomy, bad hands, text, error, missing fingers, 
  extra digit, fewer digits, cropped, worst quality, low quality, 
  normal quality, jpeg artifacts, signature, watermark, username, 
  blurry, bad feet, poorly drawn hands, poorly drawn face, mutation, 
  deformed, ugly, bad proportions, extra limbs, cloned face, 
  disfigured, gross proportions, malformed limbs, missing arms, 
  missing legs, extra arms, extra legs, fused fingers, too many fingers
