# Image Prompts Configuration for Lass Character
# ================================================
# This is the single source of truth for all image generation prompts.
# Documentation is auto-generated from this file via scripts/generate_prompt_docs.py
#
# Prompt Structure:
#   - base_prompt: Constant character elements (Lass appearance)
#   - checkpoints: Predetermined prompts for specific achievements
#   - dynamic_template: LLM prompt for generating dynamic posts
#
# Each checkpoint has 4 components:
#   - setting: background, location, camera angle
#   - mood_expression: facial expression, emotional state
#   - action: pose, what she's doing
#   - extras: lighting, effects, additional elements

# =============================================================================
# BASE PROMPT - Constant for ALL images (Lass character trigger)
# =============================================================================
