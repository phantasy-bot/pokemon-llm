<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lass Commentary - OBS Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive;
            overflow: hidden;
        }

        .widget-container {
            padding: 16px 20px;
            max-width: 600px;
        }

        @font-face {
            font-family: 'Sometype Mono';
            src: url('./fonts/SometypeMono-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        .commentary-text {
            color: #000000;
            font-family: 'Sometype Mono', monospace;
            font-size: 24px;
            line-height: 1.5;
            font-weight: 600;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .commentary-text.empty {
            color: rgba(255,255,255,0.5);
            font-style: italic;
        }

        /* Chat response styling */
        .chat-response-container {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid rgba(138, 43, 226, 0.3);
        }

        .chat-response {
            color: #6B21A8;
            font-family: 'Sometype Mono', monospace;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 500;
            animation: fadeIn 0.3s ease-out;
        }

        .chat-response .username {
            color: #7C3AED;
            font-weight: 700;
        }

        .chat-response.past-message {
            opacity: 0.85;
            font-style: italic;
        }

        .chat-response.past-message::before {
            content: "📬 ";
        }

        /* Hidden connection status - uncomment to show */
        .status-dot {
            display: none;
            /* position: fixed;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            transition: background 0.3s; */
        }

        .status-dot.connected {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="status-dot" id="statusDot"></div>
    
    <div class="widget-container">
        <p class="commentary-text" id="commentaryText"></p>
        <div class="chat-response-container" id="chatResponseContainer" style="display: none;">
            <p class="chat-response" id="chatResponseText"></p>
        </div>
    </div>

    <script>
        const WS_URL = 'ws://localhost:8765';
        const commentaryText = document.getElementById('commentaryText');
        const chatResponseContainer = document.getElementById('chatResponseContainer');
        const chatResponseText = document.getElementById('chatResponseText');
        const statusDot = document.getElementById('statusDot');

        let ws = null;
        let reconnectTimeout = null;
        let lastCommentary = '';
        let chatResponseHideTimeout = null;

        function extractCommentary(text) {
            if (!text) return null;
            
            // Look for COMMENTARY section (now section 7 in the analysis, was 8 or 9)
            const patterns = [
                // Match section number followed by COMMENTARY and capture content on same line or next line
                /(?:7\.|8\.|9\.)\s*COMMENTARY[^\n]*\n\s*[-–•]?\s*(.+?)(?=\n\d+\.|$|\n\n)/is,
                // Match COMMENTARY with content on same line after colon/dash
                /COMMENTARY[^:]*[:\s]+[-–]?\s*(.+?)(?=\n\d+\.|$|\n\n)/is,
                // Match just the content line after COMMENTARY header
                /COMMENTARY[^\n]*\n[^\n]*(?:Lass|persona|streamer)[^\n]*\n?\s*[-–•]?\s*(.+?)(?=\n\d+\.|$|\n\n)/is,
                // Fallback: look for Lass persona pattern
                /Lass persona[:\s]*(.+?)(?=\n\d+\.|$|\n\n)/is,
                // Try to find any quoted speech-like content after COMMENTARY
                /COMMENTARY[^\n]*\n[^"]*"([^"]+)"/is,
            ];

            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    let commentary = match[1].trim();
                    // Clean up any leading dashes or bullets
                    commentary = commentary.replace(/^[-–•]\s*/, '');
                    // Remove any trailing section markers
                    commentary = commentary.replace(/\n.*$/, '');
                    // Remove any XML-style tags (like </game_analysis>)
                    commentary = commentary.replace(/<\/?[^>]+>/g, '');
                    // Remove markdown bold markers
                    commentary = commentary.replace(/\*\*/g, '');
                    commentary = commentary.trim();
                    if (commentary.length > 5) {
                        return commentary;
                    }
                }
            }
            return null;
        }

        let typewriterTimeout = null;
        let currentTypewriterText = '';
        let typewriterIndex = 0;

        function typewriterEffect(text, element, speed = 30, onComplete = null) {
            // Clear any existing typewriter animation
            if (typewriterTimeout) {
                clearTimeout(typewriterTimeout);
            }
            
            currentTypewriterText = text;
            typewriterIndex = 0;
            element.textContent = '';
            
            function typeNextChar() {
                if (typewriterIndex < currentTypewriterText.length) {
                    element.textContent += currentTypewriterText.charAt(typewriterIndex);
                    typewriterIndex++;
                    typewriterTimeout = setTimeout(typeNextChar, speed);
                } else if (onComplete) {
                    onComplete();
                }
            }
            
            typeNextChar();
        }

        function updateCommentary(text) {
            if (text && text !== lastCommentary) {
                lastCommentary = text;
                commentaryText.classList.remove('empty');
                
                // Use typewriter effect instead of instant text
                typewriterEffect(text, commentaryText, 25);
            }
        }

        function updateChatResponse(data) {
            if (!data) return;
            
            const username = data.username || 'viewer';
            const response = data.response || '';
            const isPast = data.is_past_message || false;
            
            if (!response) return;
            
            // Clear any existing hide timeout
            if (chatResponseHideTimeout) {
                clearTimeout(chatResponseHideTimeout);
            }
            
            // Show the chat response container
            chatResponseContainer.style.display = 'block';
            
            // Set class based on whether it's a past message
            chatResponseText.className = 'chat-response' + (isPast ? ' past-message' : '');
            
            // Format the response HTML (highlight username)
            const formattedResponse = response.replace(
                new RegExp(`@${username}\\b`, 'i'),
                `<span class="username">@${username}</span>`
            );
            
            // Use typewriter for chat response too
            chatResponseText.innerHTML = '';
            typewriterEffect(response, chatResponseText, 20, () => {
                // After typing is complete, add the username styling
                chatResponseText.innerHTML = formattedResponse;
            });
            
            // Hide chat response after 8 seconds
            chatResponseHideTimeout = setTimeout(() => {
                chatResponseContainer.style.display = 'none';
            }, 8000);
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('Connected to Pokemon LLM WebSocket');
                statusDot.classList.add('connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Check for chat_response (Twitch chat responses)
                    if (data.chat_response) {
                        updateChatResponse(data.chat_response);
                    }
                    
                    // Check for response_log (contains analysis with commentary)
                    if (data.response_log && data.response_log.text) {
                        const commentary = extractCommentary(data.response_log.text);
                        if (commentary) {
                            updateCommentary(commentary);
                        }
                    }
                    
                    // Also check log_history for initial state
                    if (data.log_history && Array.isArray(data.log_history)) {
                        for (const entry of data.log_history) {
                            if (entry.is_response && entry.text) {
                                const commentary = extractCommentary(entry.text);
                                if (commentary) {
                                    updateCommentary(commentary);
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket message:', e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                statusDot.classList.remove('connected');
                reconnectTimeout = setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                ws.close();
            };
        }

        // Start connection
        connect();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            if (chatResponseHideTimeout) clearTimeout(chatResponseHideTimeout);
            if (ws) ws.close();
        });
    </script>
</body>
</html>
